[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "w100000-spatial-simulator"
version = "1.0.0"
description = "W100000 3D/Room/Spatial Audio Simulator for speech separation dataset generation"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["audio", "acoustics", "room-impulse-response", "speech-separation", "dataset-generation"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
mesh = ["trimesh>=3.20"]
config = ["pyyaml>=6.0"]
profiling = ["psutil>=5.9"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = [
    "trimesh>=3.20",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["simulator"]
omit = ["tests/*"]
